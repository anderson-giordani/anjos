<title>Dashboard ANJOS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: menu lateral escuro fixo + área de conteúdo clara; abas Visão geral, Criativos, CRM e Gerenciador. */
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --ink:#1F2A37; --ink2:#6B6559; --muted:#A59E90; --line:#ECE6DA;
  --accent:#C98B6B; --accent2:#2F4B45; --soft:#F5ECE4; --chip:#F1EBE0;
  --good:#3F8F6B; --bad:#C4515A; --warn:#A8631F; --good-bg:#E3F2EA; --bad-bg:#F8E3E4; --warn-bg:#FBEBD9;
  --side1:#12293F; --side2:#0A1828; --overlay:rgba(10,24,40,.55); --prev:#A59E90;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1620; --surface:#17212E; --ink:#EEF1F6; --ink2:#A9B3C2; --muted:#6F7B8C; --line:#263243;
    --accent:#D9A082; --accent2:#7FB5A6; --soft:#1F2B3A; --chip:#1E2937;
    --good:#4CC38A; --bad:#F07178; --warn:#E8A65A; --good-bg:#12291F; --bad-bg:#33191D; --warn-bg:#33260F;
    --side1:#0E2236; --side2:#07121F; --overlay:rgba(0,0,0,.65); --prev:#6F7B8C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1620; --surface:#17212E; --ink:#EEF1F6; --ink2:#A9B3C2; --muted:#6F7B8C; --line:#263243;
  --accent:#D9A082; --accent2:#7FB5A6; --soft:#1F2B3A; --chip:#1E2937;
  --good:#4CC38A; --bad:#F07178; --warn:#E8A65A; --good-bg:#12291F; --bad-bg:#33191D; --warn-bg:#33260F;
  --side1:#0E2236; --side2:#07121F; --overlay:rgba(0,0,0,.65); --prev:#6F7B8C; color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100vh}
.side{width:240px;flex:none;background:linear-gradient(180deg,var(--side1),var(--side2));color:#fff;padding:28px 16px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{font-weight:800;letter-spacing:.3em;font-size:19px;padding:0 12px 32px;display:flex;align-items:center;gap:10px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,255,255,.1)}
.nav{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:12px;color:rgba(255,255,255,.72);font-size:14.5px;margin-bottom:6px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-family:inherit}
.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.nav.on svg{stroke:var(--accent)}
.nav:focus-visible,.chip:focus-visible,.sel:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.upd{margin-top:auto;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);border-radius:14px;padding:14px 16px;font-size:12px;color:rgba(255,255,255,.66);line-height:1.6}
.upd b{display:block;color:#fff;font-size:14px;margin:4px 0 2px}
.upd i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4CC38A;margin-right:6px}
.main{flex:1;min-width:0;padding:28px 36px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--ink2);margin-top:4px}
.cmpl{font-size:12px;color:var(--ink2);margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cmpl b{background:var(--soft);color:var(--accent2);padding:4px 10px;border-radius:999px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--chip);font-size:13px;color:var(--ink2);border:0;cursor:pointer;font-family:inherit;font-weight:600}
.chip.on{background:var(--ink);color:var(--surface)}
.rangebox{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.cust{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink2)}
.cust label{display:flex;gap:6px;align-items:center;font-weight:700}
.cust input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:13px}
.cust .err{color:var(--bad);font-weight:700;width:100%;text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kp .l{font-size:12px;color:var(--ink2);font-weight:600}
.kp .v{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
.kp.s .v{font-size:20px}
.kp .ba{font-size:11.5px;color:var(--muted)}
.kp .d{font-size:12px;font-weight:700;margin-top:4px}
.up{color:var(--good)} .dn{color:var(--bad)} .nt{color:var(--ink2)}
.row2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.ct{font-size:15px;font-weight:700;margin-bottom:4px}
.leg{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin:6px 0 4px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hint{font-size:11.5px;color:var(--muted)}
svg text{font-family:"Manrope",system-ui,sans-serif}
.fr{display:grid;grid-template-columns:minmax(120px,170px) minmax(60px,1fr) 52px 78px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.fr:first-of-type{border-top:0}
.fr .nm2{font-weight:700;color:var(--ink)}
.fr .bar{height:10px;border-radius:5px;background:var(--chip)}
.fr .bar i{display:block;height:100%;border-radius:5px;background:var(--accent2)}
.fr .n{text-align:right;font-weight:800;color:var(--ink)}
.fr .c{text-align:right}
.fh{display:grid;grid-template-columns:minmax(120px,170px) minmax(60px,1fr) 52px 78px;gap:12px;font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;padding-bottom:6px}
.fh span:nth-child(n+3){text-align:right}
.flt{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.sel{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink2);font-family:inherit;font-weight:600;cursor:pointer}
.sel.on{background:var(--soft);color:var(--ink);border-color:var(--accent)}
input.sel{cursor:text;min-width:240px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.cr{padding:0;overflow:hidden;cursor:pointer;text-align:left;font-family:inherit;color:inherit;display:block;width:100%}
.cr:hover{border-color:var(--accent)}
.th{height:116px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--soft),var(--chip))}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{width:40px;height:40px;border-radius:50%;background:var(--surface);opacity:.92;display:flex;align-items:center;justify-content:center;position:relative}
.play:after{content:'';border-left:11px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.play.img:after{border:0;margin:0;width:16px;height:12px;border:2px solid var(--ink);border-radius:3px}
.tag{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface);color:var(--ink);z-index:1}
.tag.best{background:var(--accent2);color:var(--surface)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.cb{padding:14px 16px 16px}
.cn{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm{font-size:12px;color:var(--muted);margin:3px 0 2px}
.cs{font-size:11px;color:var(--muted);margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m6{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 10px}
.m6 span{display:block;font-size:10.5px;color:var(--muted)}
.m6 b{font-size:13.5px;font-weight:700;white-space:nowrap}
.sp2{grid-column:span 2}
table{width:100%;border-collapse:collapse;font-size:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
th{background:var(--chip);font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);padding:11px 8px;text-align:right;font-weight:700;white-space:nowrap}
td{padding:12px 8px;border-top:1px solid var(--line);text-align:right;color:var(--ink2);white-space:nowrap}
td b{color:var(--ink);font-weight:700}
th.l,td.l{text-align:left}
td.nm{white-space:normal;min-width:220px;max-width:290px;line-height:1.35}
tr.tot td{background:var(--chip);font-weight:800;color:var(--ink)}
.lnk{background:none;border:0;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;padding:0}
.lnk:hover{color:var(--accent);text-decoration:underline}
.sw{width:30px;height:17px;border-radius:9px;background:var(--line);position:relative;display:inline-block;vertical-align:middle}
.sw:after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff}
.sw.on{background:var(--good)} .sw.on:after{left:15px}
.stt{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.stt.a{background:var(--good-bg);color:var(--good)} .stt.l{background:var(--warn-bg);color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:10px 18px;font-size:14px;color:var(--ink2);border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:none;font-family:inherit;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab.on{color:var(--ink);font-weight:800;border-bottom-color:var(--accent)}
.tab i{font-style:normal;font-size:11px;background:var(--chip);padding:2px 8px;border-radius:999px}
.crumb{font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.crumb button{background:none;border:0;font:inherit;color:var(--accent);font-weight:700;cursor:pointer;padding:0}
.chp{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;display:inline-block}
.chp.g{background:var(--good-bg);color:var(--good)} .chp.w{background:var(--warn-bg);color:var(--warn)} .chp.c{background:var(--bad-bg);color:var(--bad)}
.sb{display:inline-block;width:110px;height:8px;border-radius:4px;background:var(--chip);vertical-align:middle;margin-right:10px}
.sb i{display:block;height:100%;border-radius:4px;background:var(--accent2)}
.rb{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:13px;color:var(--ink2)}
.rb .n{width:210px;flex:none}.rb .b{flex:1;height:10px;border-radius:5px;background:var(--chip);min-width:40px}
.rb .b i{display:block;height:100%;border-radius:5px;background:var(--accent)} .rb .c{width:46px;text-align:right;color:var(--ink);font-weight:700}
.dash{border:1.5px dashed var(--line);background:transparent}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--warn-bg);color:var(--warn);margin-left:8px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov[hidden]{display:none}
.md{width:min(820px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px;padding:26px 28px}
.md .hd{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.md .hd>div:nth-child(2){flex:1;min-width:0}
.md .tm{width:76px;height:76px;border-radius:14px;background:linear-gradient(135deg,var(--soft),var(--chip));display:flex;align-items:center;justify-content:center;flex:none;position:relative;overflow:hidden}
.xbtn{margin-left:auto;font-size:20px;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 8px}
.mg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.mg div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mg span{display:block;font-size:11px;color:var(--muted)} .mg b{font-size:17px;font-weight:800}
.mg em{display:block;font-style:normal;font-size:11px;font-weight:700;margin-top:2px}
.mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.mf div{border-radius:10px;background:var(--chip);padding:10px 12px}
.mf span{display:block;font-size:11px;color:var(--muted)} .mf b{font-size:16px;font-weight:800} .mf small{display:block;font-size:11px;color:var(--ink2)}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink);font-family:inherit;font-weight:700;cursor:pointer}
.obs{background:var(--warn-bg);border-radius:12px;padding:12px 16px;font-size:12.5px;line-height:1.5;margin-bottom:14px;color:var(--ink)}
.obs b{font-weight:800}.obs p{margin:4px 0 6px;color:var(--ink2)}.obs ul{margin:0;padding-left:18px;color:var(--ink2)}.obs li{margin:2px 0}
.obn{font-size:11px;font-weight:500;line-height:1.35;color:var(--warn);margin-top:4px;white-space:normal}.obn b{font-weight:800}
.note{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.row2{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:12px 16px;overflow-x:auto;gap:4px}
  .logo{padding:0 12px 0 0}.nav{width:auto;margin:0;white-space:nowrap;padding:10px 12px}.upd{display:none}
  .main{padding:20px 16px 40px}.g5,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rb .n{width:120px}.mg{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>

<div class="app">
  <nav class="side" aria-label="Seções do dashboard">
    <div class="logo"><i></i>ANJOS</div>
    <div id="nav"></div>
    <div class="upd" id="upd"></div>
  </nav>
  <main class="main">
    <div class="top">
      <div>
        <h1 id="title"></h1>
        <div class="sub" id="subtitle"></div>
        <div class="cmpl" id="cmpl"></div>
      </div>
      <div class="rangebox"><div class="chips" id="chips" role="group" aria-label="Período"></div><div id="custom"></div></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="ov" id="ov" hidden><div class="md" id="md" role="dialog" aria-modal="true"></div></div>

<script>
const DATA = /*__DATA__*/null;

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (n, d = 0) => (n == null || !isFinite(n)) ? '—' : n.toLocaleString('pt-BR', {minimumFractionDigits: d, maximumFractionDigits: d});
const brl = (n, d = 0) => (n == null || !isFinite(n)) ? '—' : 'R$ ' + nf(n, d);
const pct = (n, d = 2) => (n == null || !isFinite(n)) ? '—' : nf(n, d) + '%';
const dmy = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
const rng = r => dmy(r[0]) + (r[0] === r[1] ? '' : '–' + dmy(r[1]));
const ICON = {
  geral: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  criativos: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/>',
  crm: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.9 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18.5 14.8c1.6.7 2.7 2.3 3 5.2"/>',
  gerenciador: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 10h18M9 10v10"/>'
};
const TABS = [['geral', 'Visão geral'], ['criativos', 'Criativos'], ['crm', 'CRM'], ['gerenciador', 'Gerenciador']];
const PRESETS = [[1, 'Ontem'], [7, '7 dias'], [14, '14 dias'], [30, '30 dias']];
const S = {tab: 'geral', range: {kind: 'preset', p: 30}, mgr: 'campanhas', mgrCamp: null, mgrSet: null, status: 'todos', q: '', ad: null};
try { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) S.tab = h; } catch (e) {}

/* ---------- período: o último dia é sempre D-1 (ontem); o anterior tem o mesmo tamanho ---------- */
const dobj = s => new Date(s + 'T12:00:00');
const addDays = (s, n) => { const d = dobj(s); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const diffDays = (a, b) => Math.round((dobj(b) - dobj(a)) / 864e5);
const validRange = r => r && r.start >= DATA.start && r.end <= DATA.end && r.start <= r.end;
try {
  const saved = JSON.parse(localStorage.getItem('anjos.r') || 'null');
  if (saved && saved.kind === 'preset' && PRESETS.some(x => x[0] === saved.p)) S.range = saved;
  else if (saved && saved.kind === 'custom' && validRange(saved)) S.range = saved;
} catch (e) {}
function R() {
  let s, e;
  if (S.range.kind === 'custom') { s = S.range.start; e = S.range.end; }
  else { e = DATA.end; s = addDays(e, -(S.range.p - 1)); }
  const n = diffDays(s, e) + 1, ps = addDays(s, -n), pe = addDays(s, -1);
  return {s, e, n, cur: [s, e], prev: [ps, pe], prevOk: ps >= DATA.start};
}
const minLeadsFor = () => { const n = R().n; return n >= 30 ? 10 : n >= 14 ? 8 : n >= 7 ? 5 : 2; };

/* ---------- métricas: somadas dos dados diários por anúncio ---------- */
const ZERO = {spend: 0, impressions: 0, reach: 0, link_clicks: 0, leads: 0, video_p25: 0};
const NULLM = {spend: null, impressions: null, reach: null, link_clicks: null, leads: null, video_p25: null, cpl: null, ctr: null, cpm: null, freq: null, hook: null};
const M = m => {
  m = m === undefined ? ZERO : m;
  return {...m,
    cpl: m.leads ? m.spend / m.leads : null,
    ctr: m.impressions ? m.link_clicks / m.impressions * 100 : null,
    cpm: m.impressions ? m.spend / m.impressions * 1000 : null,
    freq: m.reach && m.impressions ? m.impressions / m.reach : null,
    hook: m.impressions && m.video_p25 ? m.video_p25 / m.impressions * 100 : null};
};
const AGG = {};
function agg(range) {
  const k = range.join('|');
  if (AGG[k]) return AGG[k];
  const mk = () => ({spend: 0, impressions: 0, link_clicks: 0, leads: 0, video_p25: 0});
  const add = (o, r) => { o.spend += r[4]; o.impressions += r[5]; o.link_clicks += r[6]; o.leads += r[7]; o.video_p25 += r[8]; };
  const A = {ad: {}, adset: {}, campaign: {}, account: mk()};
  for (const r of DATA.daily_ads) {
    if (r[0] < range[0] || r[0] > range[1]) continue;
    add(A.account, r); add(A.ad[r[1]] ||= mk(), r); add(A.adset[r[2]] ||= mk(), r); add(A.campaign[r[3]] ||= mk(), r);
  }
  // alcance não se soma entre dias: só existe para os períodos fixos (1, 7, 14 e 30 dias)

  <div class="row2"><div class="card"><div class="ct">Motivos de perda</div><div class="hint">${nf(c.lost)} leads perdidos${lostPct != null ? ' (' + nf(lostPct, 0) + '% dos leads do CRM)' : ''} · custo estimado desperdiçado ${brl(c.total ? c.lost * a.spend / c.total : 0)}</div>
    <div style="margin-top:8px">${reasons.length ? reasons.map(([n, v]) => `<div class="rb"><div class="n">${esc(n)}</div><div class="b"><i style="width:${v / maxR * 100}%;${n === 'SPAM' ? 'background:var(--accent2)' : ''}"></i></div><div class="c">${v}</div></div>`).join('') : '<div class="empty">Sem perdas no período.</div>'}</div></div>
  <div style="display:flex;flex-direction:column;gap:14px"><div class="card"><div class="ct">Onde os leads são perdidos</div><div class="hint">Etapa em que o lead estava ao ser perdido</div><div style="margin-top:8px">${ls.length ? ls.map(([k, v]) => `<div class="rb"><div class="n" style="width:170px">${k} · ${esc(DATA.stage_names[k])}</div><div class="b"><i style="width:${v / maxL * 100}%"></i></div><div class="c">${v}</div></div>`).join('') : '<div class="empty">—</div>'}</div></div>
  <div class="card dash"><div class="ct">Motivos de ganho <span class="badge">precisa de campo no Pipedrive</span></div><div class="hint">${nf(c.won)} ganho${c.won === 1 ? '' : 's'} no período${c.won ? ' · valor ' + brl(c.won_value) : ''}. O Pipedrive só registra motivo de perda. Para exibir o motivo de ganho, crie um campo no negócio, preenchido quando for ganho, e avise para eu ligar aqui.</div></div></div></div>`;
}

const STT = {ACTIVE: ['Ativa', 'a'], PAUSED: ['Pausada', ''], CAMPAIGN_PAUSED: ['Campanha pausada', ''], ADSET_PAUSED: ['Conjunto pausado', ''], WITH_ISSUES: ['Com problemas', 'l'], IN_PROCESS: ['Em processamento', 'l'], PENDING_REVIEW: ['Em análise', 'l'], DISAPPROVED: ['Reprovado', 'l'], ARCHIVED: ['Arquivada', ''], LEARNING: ['Em aprendizado', 'l']};
function viewGerenciador() {
  const lv = S.mgr === 'campanhas' ? 'campaign' : S.mgr === 'conjuntos' ? 'adset' : 'ad';
  let list = DATA.entities[lv === 'ad' ? 'ads' : lv === 'adset' ? 'adsets' : 'campaigns'].map(e => ({e, m: rowOf(lv, 'cur', e.id)}));
  const counts = {campanhas: DATA.entities.campaigns.length, conjuntos: DATA.entities.adsets.length, anuncios: DATA.entities.ads.length};
  if (lv !== 'campaign' && S.mgrCamp) list = list.filter(x => x.e.campaign_id === S.mgrCamp);
  if (lv === 'ad' && S.mgrSet) list = list.filter(x => x.e.adset_id === S.mgrSet);
  if (S.status === 'ativos') list = list.filter(x => x.e.on);
  if (S.status === 'gasto') list = list.filter(x => x.m.spend > 0);
  if (S.q) list = list.filter(x => norm(x.e.name).includes(norm(S.q)) || x.e.id.includes(S.q));
  list.sort((x, y) => y.m.spend - x.m.spend);
  const tot = M(list.reduce((s, x) => { for (const k in ZERO) s[k] += x.m[k] || 0; return s; }, {...ZERO}));
  const tabs = [['campanhas', 'Campanhas'], ['conjuntos', 'Conjuntos de anúncios'], ['anuncios', 'Anúncios']];
  const crumb = (S.mgrCamp || S.mgrSet) ? `<div class="crumb"><button data-clear="1">Todas as campanhas</button>${S.mgrCamp ? ' › ' + esc(entName('campaign', S.mgrCamp)) : ''}${S.mgrSet ? ' › ' + esc(entName('adset', S.mgrSet)) : ''}</div>` : '';
  const cols = lv === 'campaign' ? 'Campanha' : lv === 'adset' ? 'Conjunto de anúncios' : 'Anúncio';
  const body = list.map(({e, m}) => {
    const st = STT[e.status] || [e.status || '—', ''];
    const name = (lv === 'ad' ? `<b>${esc(e.name)}</b>` : `<button class="lnk" data-drill="${esc(e.id)}">${esc(e.name)}</button>`)
      + (m.lead_note ? `<div class="obn"><b>Observação:</b> ${esc(m.lead_note)}</div>` : '');
    return `<tr><td class="l"><span class="sw ${e.on ? 'on' : ''}" title="Status no Meta (somente leitura)"></span></td><td class="l nm">${name}</td><td class="l"><span class="stt ${st[1]}">${esc(st[0])}</span></td>
    <td>${e.budget ? (e.budget_type || '') + ' ' + brl(e.budget) : '—'}</td><td><b>${m.leads ? nf(m.leads) : (m.spend ? '0' : '—')}</b></td><td><b>${brl(m.cpl, 2)}</b></td><td>${brl(m.spend)}</td><td>${nf(m.impressions)}</td><td>${nf(m.reach)}</td><td>${brl(m.cpm, 2)}</td><td>${pct(m.ctr)}</td><td>${nf(m.freq, 2)}</td></tr>`;
  }).join('');
  return `<div class="tabs" role="tablist">${tabs.map(([k, n]) => `<button class="tab ${S.mgr === k ? 'on' : ''}" data-mgr="${k}" role="tab">${n}<i>${counts[k]}</i></button>`).join('')}</div>
  <div class="flt"><input class="sel" id="q" placeholder="Buscar por nome ou ID" value="${esc(S.q)}" aria-label="Buscar">
    ${[['todos', 'Todos'], ['ativos', 'Ativos'], ['gasto', 'Com gasto no período']].map(([k, n]) => `<button class="sel ${S.status === k ? 'on' : ''}" data-st="${k}">${n}</button>`).join('')}</div>${crumb}
  <div class="tw"><table><tr><th class="l"></th><th class="l">${cols}</th><th class="l">Veiculação</th><th>Orçamento</th><th>Resultados (leads)</th><th>Custo / result.</th><th>Valor usado</th><th>Impressões</th><th>Alcance</th><th>CPM</th><th>CTR (link)</th><th>Frequência</th></tr>
  ${body || '<tr><td colspan="12" class="empty">Nada encontrado com esses filtros.</td></tr>'}
  <tr class="tot"><td></td><td class="l">Total (${list.length})</td><td></td><td></td><td>${nf(tot.leads)}</td><td>${brl(tot.cpl, 2)}</td><td>${brl(tot.spend)}</td><td>${nf(tot.impressions)}</td><td>—</td><td>${brl(tot.cpm, 2)}</td><td>${pct(tot.ctr)}</td><td>—</td></tr></table></div>
  <div class="note">Clique no nome de uma campanha para ver os conjuntos dela, e no conjunto para ver os anúncios. O interruptor mostra o status no Meta; o dashboard não liga nem desliga anúncios. Alcance e frequência são do período inteiro e não são somados no total.</div>`;
}
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

/* ---------- render ---------- */
function render() {
  const r = R();
  $('nav').innerHTML = TABS.map(([k, n]) => `<button class="nav ${S.tab === k ? 'on' : ''}" data-tab="${k}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${n}</button>`).join('');
  const isC = S.range.kind === 'custom';
  $('chips').innerHTML = PRESETS.map(([k, n]) => `<button class="chip ${!isC && S.range.p === k ? 'on' : ''}" data-p="${k}">${n}</button>`).join('') + `<button class="chip ${isC ? 'on' : ''}" data-custom="1">Personalizado</button>`;
  $('custom').innerHTML = isC ? `<div class="cust"><label>De <input type="date" id="cs" min="${DATA.start}" max="${DATA.end}" value="${S.range.start}"></label><label>até <input type="date" id="ce" min="${DATA.start}" max="${DATA.end}" value="${S.range.end}"></label><span class="hint">O último dia possível é ontem (${dmy(DATA.end)}).</span>${S.rangeErr ? `<div class="err">${esc(S.rangeErr)}</div>` : ''}</div>` : '';
  const T = {geral: ['Visão geral', DATA.account_name + ' · Meta Ads'], criativos: ['Criativos', 'Anúncios ordenados por custo por lead'], crm: ['CRM · Funil', 'Somente leads do Meta · funil NACIONAL · custo real por etapa'], gerenciador: ['Gerenciador', 'Conta ' + DATA.account]}[S.tab];
  $('title').textContent = T[0]; $('subtitle').textContent = T[1]; document.title = 'Dashboard ANJOS';
  $('cmpl').innerHTML = `<b>${rng(r.cur)}</b> (${r.n} ${r.n === 1 ? 'dia' : 'dias'}) ` + (r.prevOk ? `comparado com <b>${rng(r.prev)}</b> (mesmo nº de dias)` : `sem período anterior com dados (os dados começam em ${dmy(DATA.start)}/${DATA.start.slice(0, 4)})`);
  const gen = new Date(DATA.generated_at);
  const gtxt = gen.toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo'});
  $('upd').innerHTML = `<i></i>Atualização automática<b>${gtxt}</b>Dados até ${dmy(DATA.end)}`;
  $('view').innerHTML = {geral: viewGeral, criativos: viewCriativos, crm: viewCRM, gerenciador: viewGerenciador}[S.tab]();
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab],[data-p],[data-custom],[data-ad],[data-mgr],[data-st],[data-drill],[data-clear]');
  if (!t) { if (ev.target === $('ov')) closeAd(); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; try { location.hash = S.tab; } catch (e) {} render(); window.scrollTo(0, 0); }
  else if (t.dataset.p) { S.range = {kind: 'preset', p: +t.dataset.p}; S.rangeErr = ''; saveRange(); render(); }
  else if (t.dataset.custom) { const r = R(); S.range = {kind: 'custom', start: r.s, end: r.e}; S.rangeErr = ''; saveRange(); render(); }
  else if (t.dataset.ad) openAd(t.dataset.ad);
  else if (t.dataset.mgr) { S.mgr = t.dataset.mgr; render(); }
  else if (t.dataset.st) { S.status = t.dataset.st; render(); }
  else if (t.dataset.clear) { S.mgrCamp = S.mgrSet = null; S.mgr = 'campanhas'; render(); }
  else if (t.dataset.drill) {
    if (S.mgr === 'campanhas') { S.mgrCamp = t.dataset.drill; S.mgr = 'conjuntos'; }
    else if (S.mgr === 'conjuntos') { S.mgrSet = t.dataset.drill; S.mgr = 'anuncios'; }
    render();
  }
});
document.addEventListener('input', ev => { if (ev.target.id === 'q') { S.q = ev.target.value; const pos = ev.target.selectionStart; render(); const q = $('q'); q.focus(); q.setSelectionRange(pos, pos); } });
const saveRange = () => { try { localStorage.setItem('anjos.r', JSON.stringify(S.range)); } catch (e) {} };
document.addEventListener('change', ev => {
  if (ev.target.id !== 'cs' && ev.target.id !== 'ce') return;
  const start = $('cs').value, end = $('ce').value;
  if (!start || !end) { S.rangeErr = 'Escolha as duas datas.'; }
  else if (start > end) { S.rangeErr = 'A data inicial precisa ser anterior à final.'; }
  else if (start < DATA.start) { S.rangeErr = 'Os dados começam em ' + dmy(DATA.start) + '/' + DATA.start.slice(0, 4) + '.'; }
  else if (end > DATA.end) { S.rangeErr = 'O último dia possível é ontem (' + dmy(DATA.end) + ').'; }
  else { S.rangeErr = ''; S.range = {kind: 'custom', start, end}; saveRange(); render(); return; }
  // data inválida: mostra o aviso sem apagar o que a pessoa digitou
  const box = document.querySelector('.cust');
  let el = box.querySelector('.err');
  if (!el) { el = document.createElement('div'); el.className = 'err'; box.appendChild(el); }
  el.textContent = S.rangeErr;
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeAd(); });
render();
</script>
